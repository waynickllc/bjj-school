{% extends "base.html" %}

{% block title %}Page Not Found - BJJ School{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <h1 class="display-1 text-muted">404</h1>
        <h2 class="mb-4">Page Not Found</h2>
        <p class="lead mb-4">
            Sorry, the page you're looking for doesn't exist or has been moved.

        <div class="mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="currentColor" class="bi bi-search text-muted" viewBox="0 0 16 16">
                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
            </svg>
        </div>
        <div>
            <a href="{{ url_for('main.home') }}" class="btn btn-primary btn-lg me-2">
                <i class="bi bi-house-door"></i> Go to Homepage
            </a>
            <a href="{{ url_for('contact.contact') }}" class="btn btn-outline-secondary btn-lg">
                <i class="bi bi-envelope"></i> Contact Us
            </a>
        </div>
    </div>
</div>
{% endblock %}
