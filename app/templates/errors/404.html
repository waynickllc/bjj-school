{% extends "base.html" %}

{% block title %}Page Not Found - BJJ School{% endblock %}

{% block extra_css %}
<style>
    .error-page {
        text-align: center;
        padding: 4rem 2rem;
        max-width: 800px;
        margin: 0 auto;
    }
    
    .error-code {
        font-size: 8rem;
        font-weight: 900;
        color: var(--text-light);
        line-height: 1;
        margin-bottom: 1rem;
    }
    
    .error-page h2 {
        font-size: 2rem;
        font-weight: 900;
        color: var(--secondary);
        margin-bottom: 1.5rem;
    }
    
    .error-page p {
        font-size: 1.2rem;
        color: var(--text-light);
        margin-bottom: 2rem;
        line-height: 1.8;
    }
    
    .error-icon {
        margin: 2rem 0;
        color: var(--text-light);
    }
    
    .error-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 2rem;
    }
    
    @media (max-width: 768px) {
        .error-code {
            font-size: 5rem;
        }
        
        .error-actions {
            flex-direction: column;
            align-items: center;
        }
        
        .error-actions .btn {
            width: 100%;
            max-width: 300px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-code">404</div>
    <h2>Page Not Found</h2>
    <p>Sorry, the page you're looking for doesn't exist or has been moved.</p>
    
    <div class="error-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" fill="currentColor" viewBox="0 0 16 16">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
        </svg>
    </div>
    
    <div class="error-actions">
        <a href="{{ url_for('main.home') }}" class="btn btn-primary">Go to Homepage</a>
        <a href="{{ url_for('contact.contact') }}" class="btn btn-secondary">Contact Us</a>
    </div>
</div>
{% endblock %}
